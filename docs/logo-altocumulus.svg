<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Cloud shape -->
  <defs>
    <linearGradient id="cloudGrad" x1="4" y1="20" x2="44" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7cc8fb"/>
      <stop offset="50%" stop-color="#36a9f7"/>
      <stop offset="100%" stop-color="#0c8ee7"/>
    </linearGradient>
  </defs>
  <!-- Cumulus cloud body -->
  <ellipse cx="24" cy="28" rx="20" ry="12" fill="url(#cloudGrad)"/>
  <ellipse cx="16" cy="22" rx="10" ry="10" fill="url(#cloudGrad)"/>
  <ellipse cx="32" cy="24" rx="14" ry="10" fill="url(#cloudGrad)"/>
  <ellipse cx="24" cy="20" rx="12" ry="10" fill="url(#cloudGrad)"/>
  <!-- Inner glow -->
  <ellipse cx="24" cy="26" rx="14" ry="8" fill="white" opacity="0.3"/>
  <!-- DB icon (cylinder) -->
  <ellipse cx="24" cy="22" rx="6" ry="2.5" fill="white" opacity="0.9"/>
  <rect x="18" y="22" width="12" height="8" fill="white" opacity="0.8"/>
  <ellipse cx="24" cy="30" rx="6" ry="2.5" fill="white" opacity="0.6"/>
  <!-- Stack lines on cylinder -->
  <line x1="18" y1="25" x2="30" y2="25" stroke="#0c8ee7" stroke-width="0.8" opacity="0.4"/>
  <line x1="18" y1="28" x2="30" y2="28" stroke="#0c8ee7" stroke-width="0.8" opacity="0.4"/>
</svg>
